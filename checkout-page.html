<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- TailwindCss -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome 6.5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer"
    />
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon" />
    <!-- Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <!-- Styling p and span -->
    <style>
        @layer base {
            p,
            span {
                font-family: "Inter";
            }
        }
    </style>
    <title>REWEAR - Shopping Cart</title>
</head>

<body class="bg-[#F7F5F0] text-[#252522] font-[Inter]">
    <!-- REWEAR HEADER -->
    <header class="sticky top-0 z-50 bg-[#F7F5F0]/95 backdrop-blur-md border-b border-[#252522]/10">
        <div class="max-w-7xl mx-auto px-5 lg:px-10">

            <div class="h-20 flex items-center justify-between">

                <a href="index.html" class="text-3xl font-bold tracking-tighter text-[#252522]">
                REWEAR<span class="text-[#A58C67]">.</span>
            </a>

                <nav class="hidden md:flex items-center gap-8 text-sm font-medium">
                    <a href="index.html" class="hover:text-[#A58C67] transition">Home</a>
                    <a href="product-page.html" class="hover:text-[#A58C67] transition">Shop</a>
                    <a href="product-page.html?category=men" class="hover:text-[#A58C67] transition">Men</a>
                    <a href="product-page.html?category=women" class="hover:text-[#A58C67] transition">Women</a>
                    <a href="contact-page.html" class="hover:text-[#A58C67] transition">Contact</a>
                </nav>

                <div class="flex items-center gap-5">

                    <a href="Account-page.html" aria-label="Account">
                        <i class="fa-regular fa-user text-lg"></i>
                    </a>

                    <a href="cart-page.html" aria-label="Shopping cart">
                        <i class="fa-solid fa-bag-shopping text-lg"></i>
                    </a>

                    <button id="mobile-menu-button" class="md:hidden text-xl" aria-label="Toggle navigation" aria-expanded="false" type="button">
                    <i class="fa-solid fa-bars"></i>
                </button>

                </div>
            </div>

            <nav id="mobile-menu" class="hidden md:hidden border-t border-[#252522]/10 py-5 space-y-4">
                <a href="index.html" class="block text-sm">Home</a>
                <a href="product-page.html" class="block text-sm">Shop</a>
                <a href="product-page.html?category=men" class="block text-sm">Men</a>
                <a href="product-page.html?category=women" class="block text-sm">Women</a>
                <a href="contact-page.html" class="block text-sm">Contact</a>
            </nav>

        </div>
    </header>

    <!-- CHECKOUT SECTION -->
    <main class="max-w-7xl mx-auto px-5 lg:px-10 py-16">

        <!-- Heading -->
        <div class="mb-12">
            <p class="text-sm uppercase tracking-[0.2em] text-[#A58C67] mb-3">
                Almost Yours
            </p>

            <h1 class="text-4xl md:text-5xl font-semibold tracking-tight">
                Checkout
            </h1>

            <p class="text-[#85816F] mt-3">
                Complete your information to place your order.
            </p>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-12">

            <!-- Customer Information -->
            <section class="lg:col-span-2">

                <form id="checkout-form" class="space-y-10">

                    <!-- Contact Information -->
                    <div>
                        <h2 class="text-xl font-semibold mb-6">
                            Contact Information
                        </h2>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">

                            <div>
                                <label for="customer-name" class="block text-sm font-medium mb-2">
                                Full Name
                            </label>

                                <input type="text" id="customer-name" name="name" required placeholder="Enter your full name" class="w-full bg-white border border-[#252522]/15 rounded-xl px-4 py-4 outline-none focus:border-[#A58C67]">
                            </div>

                            <div>
                                <label for="customer-phone" class="block text-sm font-medium mb-2">
                                Phone Number
                            </label>

                                <input type="tel" id="customer-phone" name="phone" required placeholder="06XXXXXXXX" class="w-full bg-white border border-[#252522]/15 rounded-xl px-4 py-4 outline-none focus:border-[#A58C67]">
                            </div>

                        </div>
                    </div>

                    <!-- Delivery Address -->
                    <div>
                        <h2 class="text-xl font-semibold mb-6">
                            Delivery Address
                        </h2>

                        <div class="space-y-5">

                            <div>
                                <label for="customer-city" class="block text-sm font-medium mb-2">
                                City
                            </label>

                                <input type="text" id="customer-city" name="city" required placeholder="Enter your city" class="w-full bg-white border border-[#252522]/15 rounded-xl px-4 py-4 outline-none focus:border-[#A58C67]">
                            </div>

                            <div>
                                <label for="customer-address" class="block text-sm font-medium mb-2">
                                Street Address
                            </label>

                                <textarea id="customer-address" name="address" required rows="4" placeholder="Street, building, apartment..." class="w-full bg-white border border-[#252522]/15 rounded-xl px-4 py-4 outline-none focus:border-[#A58C67] resize-none"></textarea>
                            </div>

                        </div>
                    </div>

                    <!-- Payment Method -->
                    <div>
                        <h2 class="text-xl font-semibold mb-6">
                            Payment Method
                        </h2>

                        <label class="flex items-center gap-4 bg-white border border-[#A58C67] rounded-xl p-5 cursor-pointer">

                        <input
                            type="radio"
                            name="payment"
                            value="cod"
                            checked
                            class="accent-[#A58C67]"
                        >

                        <div>
                            <p class="font-semibold">
                                Cash on Delivery
                            </p>

                            <p class="text-sm text-[#85816F] mt-1">
                                Pay when your order arrives.
                            </p>
                        </div>

                        <i class="fa-solid fa-money-bill-wave ml-auto text-xl text-[#A58C67]"></i>

                    </label>
                    </div>

                </form>

            </section>

            <!-- Order Summary -->
            <aside class="bg-white rounded-2xl border border-[#252522]/10 p-7 h-fit">

                <h2 class="text-xl font-semibold mb-7">
                    Your Order
                </h2>

                <div id="checkout-items" class="space-y-5">
                    <!-- Products will appear here -->
                </div>

                <div class="border-t border-[#252522]/10 mt-7 pt-6">

                    <div class="flex justify-between mb-4 text-sm">
                        <span class="text-[#85816F]">Subtotal</span>
                        <span id="checkout-subtotal">0 MAD</span>
                    </div>

                    <div class="flex justify-between mb-6 text-sm">
                        <span class="text-[#85816F]">Delivery</span>
                        <span>Calculated later</span>
                    </div>

                    <div class="flex justify-between items-center">
                        <span class="font-semibold">Total</span>

                        <span id="checkout-total" class="text-xl font-bold">
                        0 MAD
                    </span>
                    </div>

                </div>

                <button type="submit" form="checkout-form" id="place-order-button" class="w-full bg-[#252522] text-white py-4 rounded-full font-medium mt-8 hover:bg-[#A58C67] transition">
                Place Order
            </button>

                <p class="text-xs text-center text-[#85816F] mt-5">
                    <i class="fa-solid fa-shield-halved mr-1"></i> Your information is kept private.
                </p>

            </aside>

        </div>

    </main>

    <script src="JS/index.js"></script>

</body>

</html>
