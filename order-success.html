<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- TailwindCss -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Font Awesome 6.5 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer"
    />
    <link rel="shortcut icon" href="img/logo.png" type="image/x-icon" />
    <!-- Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <!-- Styling p and span -->
    <style>
        @layer base {
            p,
            span {
                font-family: "Inter";
            }
        }
    </style>

    <title>Elixo - View Product</title>
</head>

<body class="bg-[#F7F5F0] text-[#252522] font-[Inter]">
    <main class="min-h-screen flex items-center justify-center px-5">

        <div class="bg-white max-w-lg w-full p-10 rounded-2xl text-center shadow-sm">

            <div class="w-20 h-20 bg-[#E1F0E8] rounded-full flex items-center justify-center mx-auto mb-7">
                <i class="fa-solid fa-check text-3xl text-[#087F5B]"></i>
            </div>

            <p class="text-sm uppercase tracking-widest text-[#A58C67] mb-3">
                Order Confirmed
            </p>

            <h1 class="text-3xl font-semibold mb-4">
                Thank You!
            </h1>

            <p class="text-[#85816F] mb-8">
                Your order has been received successfully. We will contact you to confirm delivery.
            </p>

            <p class="text-sm text-[#85816F] mb-2">
                Your Order Number
            </p>

            <p id="order-number" class="text-xl font-bold mb-8">
                Loading...
            </p>

            <a href="product-page.html" class="block bg-[#252522] text-white py-4 rounded-full hover:bg-[#A58C67] transition">
            Continue Shopping
        </a>

        </div>

    </main>
    <script>
        const orders = JSON.parse(localStorage.getItem("rewear-orders")) || [];

        const latestOrder = orders[orders.length - 1];

        if (latestOrder) {
            document.getElementById("order-number").textContent = latestOrder.id;
        } else {
            document.getElementById("order-number").textContent = "No order found";
        }
    </script>
</body>

</html>
